<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Boxing trainer · glove dodge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0d15;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
    }
    .card {
      background: #1a1e2b;
      border-radius: 40px;
      padding: 24px 24px 28px;
      max-width: 880px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      border: 1px solid #3d4459;
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
      font-size: 1.8rem;
      letter-spacing: -0.3px;
      color: #eef2ff;
      margin-bottom: 12px;
      padding-left: 6px;
      flex-wrap: wrap;
    }
    h1 small {
      font-size: 0.9rem;
      background: #2f3a4f;
      padding: 0 16px;
      border-radius: 60px;
      font-weight: 400;
      color: #b3c7ff;
    }
    .video-wrapper {
      position: relative;
      background: #10131f;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px #313a4e, 0 12px 28px rgba(0,0,0,0.5);
      aspect-ratio: 4 / 3;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
      background: #0e121f;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px 10px;
    }
    .status-badge {
      background: #242b3d;
      padding: 6px 18px;
      border-radius: 60px;
      color: #cbd5f0;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #3b445c;
    }
    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 12px;
      background: #53c47b;
      transition: 0.2s;
    }
    .dot.inactive { background: #b34a5e; }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      background: #2a3349;
      border: none;
      border-radius: 60px;
      padding: 8px 20px;
      font-weight: 500;
      font-size: 0.95rem;
      color: #eef2ff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s;
      border: 1px solid #414b66;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .btn:active { transform: scale(0.94); }
    .btn-primary {
      background: #4f6bf5;
      border-color: #7b93ff;
      color: white;
      box-shadow: 0 4px 12px #2f48b0;
    }
    .btn-primary:hover { background: #3f5be0; }
    .btn-secondary { background: #303a52; }
    .btn-secondary:hover { background: #3d4a66; }
    .btn-warning {
      background: #b95f3d;
      border-color: #d97f5a;
    }
    .btn-warning:hover { background: #a14e30; }
    .mode-selector {
      display: flex;
      gap: 6px;
      background: #1b2131;
      padding: 4px;
      border-radius: 60px;
      border: 1px solid #2e374d;
    }
    .mode-btn {
      background: transparent;
      border: none;
      padding: 6px 16px;
      border-radius: 60px;
      color: #9baec9;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .mode-btn.active {
      background: #3f4b6b;
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .mode-btn:hover:not(.active) { background: #2f3a54; }
    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-top: 16px;
      padding: 0 4px;
      color: #9baec9;
      font-size: 0.9rem;
      gap: 8px 12px;
    }
    .stats span {
      background: #1b2131;
      padding: 6px 18px;
      border-radius: 40px;
      border: 1px solid #2e374d;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-value {
      color: #d6e2ff;
      font-weight: 600;
      min-width: 24px;
    }
    @media (max-width: 600px) {
      .card { padding: 16px; }
      h1 { font-size: 1.4rem; }
      .controls { flex-direction: column; align-items: stretch; }
      .btn-group { justify-content: center; }
      .mode-selector { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>
    🥊 BOXING TRAINER
    <small>glove dodge</small>
  </h1>

  <div class="video-wrapper">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <div class="controls">
    <div class="status-badge">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">camera off</span>
    </div>
    <div class="mode-selector" id="modeSelector">
      <button class="mode-btn active" data-mode="dodge">🏃 Dodge</button>
      <button class="mode-btn" data-mode="blink">💥 Blink</button>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="startBtn">▶ Start</button>
      <button class="btn btn-secondary" id="resetBtn">⟲ Reset</button>
    </div>
  </div>

  <div class="stats">
    <span>🤛 <span class="stat-value" id="punchCount">0</span> punches</span>
    <span>🛡️ <span class="stat-value" id="safeCount">0</span> safe</span>
    <span>🎯 <span id="modeStatus">dodge</span></span>
  </div>
</div>

<script>
  (function() {
    // ----- DOM -----
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const modeStatus = document.getElementById('modeStatus');
    const punchCountEl = document.getElementById('punchCount');
    const safeCountEl = document.getElementById('safeCount');

    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const modeBtns = document.querySelectorAll('.mode-btn');

    // ----- state -----
    let stream = null;
    let isCameraReady = false;
    let animationFrame = null;
    let gameActive = false;

    // counters
    let punches = 0;      // times glove touched you
    let safe = 0;         // successful dodges (distance based)

    // glove (point) state
    let gloveX = 0.5, gloveY = 0.5;
    const GLOVE_RADIUS = 0.055;   // relative to width

    // movement
    let dirX = 0.7, dirY = 0.5;
    const SPEED = 0.007;

    // blink mode
    let blinkTimer = 0;
    const BLINK_INTERVAL = 40;    // frames
    let gloveVisible = true;

    // mode: 'dodge' or 'blink'
    let currentMode = 'dodge';

    // collision cooldown
    let hitCooldown = 0;
    const COOLDOWN_FRAMES = 20;

    // ----- canvas resize -----
    function resizeCanvas() {
      const wrapper = canvas.parentElement;
      const rect = wrapper.getBoundingClientRect();
      canvas.width = rect.width * devicePixelRatio;
      canvas.height = rect.height * devicePixelRatio;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // ----- camera -----
    async function startCamera() {
      try {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }
        const constraints = { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        isCameraReady = true;
        statusDot.className = 'dot';
        statusText.innerText = 'camera on';
        resizeCanvas();
        if (!animationFrame) loop();
      } catch (err) {
        console.warn('camera error', err);
        isCameraReady = false;
        statusDot.className = 'dot inactive';
        statusText.innerText = 'camera blocked';
        alert('Please allow camera access and refresh.\nOr click "Start" again.');
      }
    }

    // ----- draw boxing glove (emojis + shapes) -----
    function drawGlove(x, y, radius, visible, isHit) {
      const w = canvas.width, h = canvas.height;
      const px = x * w, py = y * h;
      const r = Math.min(w, h) * radius;

      if (!visible) {
        // draw ghost outline
        ctx.beginPath();
        ctx.arc(px, py, r * 0.9, 0, 2 * Math.PI);
        ctx.strokeStyle = 'rgba(150,150,180,0.25)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 8]);
        ctx.stroke();
        ctx.setLineDash([]);
        return;
      }

      // glow
      const grad = ctx.createRadialGradient(px, py, r * 0.2, px, py, r * 2.5);
      const color = isHit ? '#ff5544' : (currentMode === 'blink' ? '#ffbb44' : '#ff7e2e');
      grad.addColorStop(0, isHit ? '#ff6644' : (currentMode === 'blink' ? '#ffcc55' : '#ff8a3a'));
      grad.addColorStop(0.7, isHit ? '#cc3322' : (currentMode === 'blink' ? '#cc8833' : '#cc5522'));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(px, py, r * 2.2, 0, 2 * Math.PI);
      ctx.fillStyle = grad;
      ctx.fill();

      // main glove (boxing glove shape using emoji + circle)
      ctx.shadowColor = isHit ? '#ff4422' : '#ffaa44';
      ctx.shadowBlur = 30;

      // draw a boxing glove emoji as base
      ctx.font = `${r * 2.2}px "Segoe UI Emoji", "Apple Color Emoji", system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowBlur = 25;
      ctx.fillStyle = isHit ? '#ff4433' : (currentMode === 'blink' ? '#f5b342' : '#e6732e');
      ctx.fillText('🥊', px, py - r * 0.1);

      // additional circle to make it more "glove like"
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(px + r * 0.2, py - r * 0.15, r * 0.45, 0, 2 * Math.PI);
      ctx.fillStyle = isHit ? '#dd3322' : (currentMode === 'blink' ? '#dba23a' : '#cc6622');
      ctx.fill();

      // highlight
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(px - r * 0.25, py - r * 0.35, r * 0.15, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(255,255,240,0.4)';
      ctx.fill();

      // "X" marks the spot
      ctx.font = `bold ${r * 0.8}px monospace`;
      ctx.fillStyle = 'rgba(255,255,220,0.7)';
      ctx.shadowBlur = 0;
      ctx.fillText('✕', px + r * 0.1, py - r * 0.1);

      // reset shadow
      ctx.shadowBlur = 0;
    }

    // ----- draw user indicator -----
    function drawUser() {
      const w = canvas.width, h = canvas.height;
      const cx = w * 0.5, cy = h * 0.5;
      const r = Math.min(w, h) * 0.085;

      ctx.beginPath();
      ctx.arc(cx, cy, r + 4, 0, 2 * Math.PI);
      ctx.strokeStyle = 'rgba(180, 200, 255, 0.2)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(70, 130, 255, 0.12)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(150, 200, 255, 0.4)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.font = `${Math.min(w,h) * 0.028}px system-ui`;
      ctx.fillStyle = 'rgba(200, 220, 255, 0.45)';
      ctx.textAlign = 'center';
      ctx.fillText('⏺ you', cx, cy + r + 22);
    }

    // ----- collision & update -----
    function updateGame() {
      if (!gameActive || !isCameraReady) return;

      const userX = 0.5, userY = 0.5;
      const dx = gloveX - userX;
      const dy = gloveY - userY;
      const dist = Math.hypot(dx, dy);
      const threshold = GLOVE_RADIUS + 0.085;

      // ----- BLINK mode -----
      if (currentMode === 'blink') {
        blinkTimer--;
        if (blinkTimer <= 0) {
          gloveVisible = !gloveVisible;
          blinkTimer = BLINK_INTERVAL;
          // when glove appears, it may appear at random position
          if (gloveVisible) {
            gloveX = 0.15 + Math.random() * 0.7;
            gloveY = 0.15 + Math.random() * 0.7;
            // random direction
            const a = Math.random() * 2 * Math.PI;
            dirX = Math.cos(a);
            dirY = Math.sin(a);
            const l = Math.hypot(dirX, dirY);
            if (l > 0) { dirX /= l; dirY /= l; }
          }
        }

        // collision only when visible
        if (gloveVisible && dist < threshold) {
          if (hitCooldown <= 0) {
            punches++;
            punchCountEl.textContent = punches;
            hitCooldown = COOLDOWN_FRAMES;
            // push glove away
            if (dist > 0.001) {
              gloveX += (dx / dist) * 0.06;
              gloveY += (dy / dist) * 0.06;
            }
            // reverse direction
            dirX *= -1.2; dirY *= -1.2;
            const l = Math.hypot(dirX, dirY);
            if (l > 0) { dirX /= l; dirY /= l; }
          }
        } else if (gloveVisible && dist > threshold + 0.02 && hitCooldown <= 0) {
          // safe dodge: glove is visible and far enough
          safe++;
          safeCountEl.textContent = safe;
        }
        // cooldown
        if (hitCooldown > 0) hitCooldown--;
        return;
      }

      // ----- DODGE mode (moving) -----
      // move glove
      gloveX += dirX * SPEED;
      gloveY += dirY * SPEED;

      const margin = GLOVE_RADIUS * 1.3;
      if (gloveX < margin) { gloveX = margin; dirX *= -1; }
      if (gloveX > 1 - margin) { gloveX = 1 - margin; dirX *= -1; }
      if (gloveY < margin) { gloveY = margin; dirY *= -1; }
      if (gloveY > 1 - margin) { gloveY = 1 - margin; dirY *= -1; }

      // random direction change
      if (Math.random() < 0.01) {
        const ang = (Math.random() - 0.5) * 0.8;
        const c = Math.cos(ang), s = Math.sin(ang);
        const nx = dirX * c - dirY * s;
        const ny = dirX * s + dirY * c;
        dirX = nx; dirY = ny;
        const l = Math.hypot(dirX, dirY);
        if (l > 0) { dirX /= l; dirY /= l; }
      }

      // collision
      if (dist < threshold) {
        if (hitCooldown <= 0) {
          punches++;
          punchCountEl.textContent = punches;
          hitCooldown = COOLDOWN_FRAMES;
          if (dist > 0.001) {
            gloveX += (dx / dist) * 0.05;
            gloveY += (dy / dist) * 0.05;
          }
          dirX *= -1.3; dirY *= -1.3;
          const l = Math.hypot(dirX, dirY);
          if (l > 0) { dirX /= l; dirY /= l; }
        }
      } else {
        if (dist > threshold + 0.025 && hitCooldown <= 0) {
          safe++;
          safeCountEl.textContent = safe;
        }
      }

      if (hitCooldown > 0) hitCooldown--;
    }

    // ----- render loop -----
    function loop() {
      if (!isCameraReady) {
        drawOverlay();
        animationFrame = requestAnimationFrame(loop);
        return;
      }

      updateGame();
      drawOverlay();
      animationFrame = requestAnimationFrame(loop);
    }

    function drawOverlay() {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // draw user
      drawUser();

      // draw glove (boxing glove)
      const isHit = hitCooldown > 0;
      const visible = (currentMode === 'blink') ? gloveVisible : true;
      drawGlove(gloveX, gloveY, GLOVE_RADIUS, visible, isHit);

      // mode label
      ctx.font = `bold ${Math.min(w,h) * 0.035}px system-ui`;
      ctx.fillStyle = 'rgba(200,215,255,0.25)';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
      ctx.fillText(currentMode.toUpperCase(), w - 20, 16);
    }

    // ----- game controls -----
    function startGame() {
      if (!isCameraReady) {
        startCamera().then(() => {
          if (isCameraReady) {
            gameActive = true;
            statusText.innerText = 'training';
            modeStatus.textContent = currentMode;
            resetCounters();
            resetGlove();
          }
        });
        return;
      }
      gameActive = true;
      statusText.innerText = 'training';
      modeStatus.textContent = currentMode;
      resetCounters();
      resetGlove();
    }

    function resetGame() {
      gameActive = false;
      statusText.innerText = isCameraReady ? 'camera on' : 'camera off';
      modeStatus.textContent = '⏸';
      resetCounters();
      resetGlove();
      hitCooldown = 0;
      if (currentMode === 'blink') {
        gloveVisible = true;
        blinkTimer = BLINK_INTERVAL;
      }
      drawOverlay();
    }

    function resetCounters() {
      punches = 0;
      safe = 0;
      punchCountEl.textContent = '0';
      safeCountEl.textContent = '0';
    }

    function resetGlove() {
      gloveX = 0.3 + Math.random() * 0.4;
      gloveY = 0.3 + Math.random() * 0.4;
      const a = Math.random() * 2 * Math.PI;
      dirX = Math.cos(a);
      dirY = Math.sin(a);
      const l = Math.hypot(dirX, dirY);
      if (l > 0) { dirX /= l; dirY /= l; }
      if (currentMode === 'blink') {
        gloveVisible = true;
        blinkTimer = BLINK_INTERVAL;
      }
    }

    // ----- mode switch -----
    function setMode(mode) {
      currentMode = mode;
      modeBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      modeStatus.textContent = mode;
      resetGlove();
      hitCooldown = 0;
      if (!gameActive) {
        drawOverlay();
      }
    }

    // ----- event listeners -----
    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetGame);

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        if (mode !== currentMode) {
          setMode(mode);
          if (gameActive) {
            // reset counters when switching mode?
            // we keep them, but glove resets
            resetGlove();
            punchCountEl.textContent = punches;
            safeCountEl.textContent = safe;
          }
        }
      });
    });

    // resize
    const ro = new ResizeObserver(() => resizeCanvas());
    ro.observe(canvas.parentElement);

    // init
    window.addEventListener('load', () => {
      resizeCanvas();
      startCamera().then(() => {
        resetGlove();
        drawOverlay();
        statusText.innerText = 'camera ready';
        modeStatus.textContent = 'press Start';
        setMode('dodge');
      });
    });

    window.addEventListener('beforeunload', () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (animationFrame) cancelAnimationFrame(animationFrame);
    });

  })();
</script>
</body>
</html>
